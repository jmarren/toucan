services:
  db:
    image: postgres:16-alpine # Using the official PostgreSQL image
    restart: always # Ensures the container restarts if it stops
    environment:
      POSTGRES_USER: ${PGUSER}  # Username for the database
      POSTGRES_PASSWORD: ${PGPASSWORD} # Password for the database user
      POSTGRES_DB: ${PGDATABASE} # Name of the database to create
    ports:
      - "5434:5432" # Maps host port 5432 to container port 5432
  
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${PGUSER} -d ${PGDATABASE} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis
    ports:
      - "6379:6379"
    environment:
        - REDIS_PASSWORD=password

